# DSH bundle for Envoy.
#
# The first row mounts Envoy's stdio MCP bridge. It starts with no toolset
# flag, so the `core` default applies and ordinary sessions do not pay for
# local-video, collection, replay, or diagnostics schemas; export
# `ENVOY_MCP_TOOLSET=full` before Harness starts when those tools are needed.
#
# Runtime pairing: this bundle is released with the Envoy CLI in
# `integrations/release-manifest.json` and needs a runtime at least as new as
# `min_runtime`. The launcher resolves a runtime in this order: `ENVOY_BIN`,
# `envoy` on PATH, then a private install under the Envoy data dir
# (`%LOCALAPPDATA%\\envoy-dsh\\runtime` on Windows,
# `~/.local/share/envoy-dsh/runtime` elsewhere). It then compares
# `envoy --version` with the required version:
#
#   * new enough           -> mount it
#   * private copy too old -> upgrade it in place from the release wheel; the
#                             venv is separate from `~/.envoy`, so existing
#                             ASR/OCR settings and downloaded models stay put
#   * external copy too old-> fail with the upgrade command instead of
#                             silently running an unsupported CLI
#
# One launcher covers every platform: it is plain Node, not a POSIX shell
# script, so Windows (which ships no such shell) mounts the same bridge macOS
# and Linux do instead of a child that dies on every call. A machine with
# neither `envoy` nor uv/python gets one actionable line on stderr and a
# failed mount. `ENVOY_DSH_VERSION` overrides the provisioned version and
# `ENVOY_DSH_REQUIRED_RUNTIME` overrides the minimum.
#
# The `-e` argument is a short stub that inflates the real launcher source
# (`launch.cjs`, kept in this package and tested for byte equality). It travels
# compressed because a cmd.exe command line is capped at 8191 characters and a
# `node` on PATH is often a .cmd shim that runs through cmd.exe.
#
# The second row registers the DSH adaptation of the Envoy Agent Skill. It
# depends only on the public `ctx.skills` service.
- insert:
    - id: envoy-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: envoy
        transport: stdio
        command: node
        args:
          - '-e'
          - |
            // Inflates and runs launch.cjs, the source of truth for this launcher.
            // The payload is gzipped+base64 because a cmd.exe command line (which a
            // `node.cmd` shim goes through on Windows) is capped at 8191 characters.
            const z = require('node:zlib');
            const code = z.gunzipSync(Buffer.from('', 'base64')).toString('utf8');
            new Function('require', 'exports', 'module', '__filename', '__dirname', code)(require, exports, module, __filename, __dirname);
        env:
          ENVOY_DSH_VERSION: '0.1.36'
        toolCallTimeoutMs: 300000
        failOnStartupError: true

    - id: envoy-skill
      name: 'envoy-dsh'
