name: 自动发布 / Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  tag-version:
    name: 标记新版本 / Tag package version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查匹配的发行版本 / Check matching package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          paths = (
              "packages/envoy-cli/pyproject.toml",
              "packages/envoy-core/pyproject.toml",
          )
          current = [
              tomllib.loads(Path(path).read_text(encoding="utf-8"))["project"]["version"]
              for path in paths
          ]
          if current[0] != current[1]:
              raise SystemExit(f"CLI/core versions must match, got {current}")
          version = current[0]
          if not re.fullmatch(
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)",
              version,
          ):
              raise SystemExit(f"Expected a stable x.y.z package version, got {version}")

          before_sha = os.environ["BEFORE_SHA"]
          previous = []
          if before_sha and set(before_sha) != {"0"}:
              for path in paths:
                  content = subprocess.check_output(
                      ["git", "show", f"{before_sha}:{path}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  previous.append(tomllib.loads(content)["project"]["version"])
          if previous and previous[0] == current[0] and previous[1] == current[1]:
              print(f"包版本未变化 {version} / Package version unchanged; no release tag needed.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("release=false\n")
              raise SystemExit(0)

          tag = f"v{version}"
          existing = subprocess.run(
              ["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"],
              check=False,
              capture_output=True,
              text=True,
          )
          if existing.returncode == 0:
              print(f"发行标签已存在 {tag} / Release tag already exists; leaving it unchanged.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("release=false\n")
              raise SystemExit(0)

          if existing.returncode != 2:
              raise SystemExit(existing.stderr or "Could not check the remote release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release=true\ntag={tag}\n")
          PY
      - name: 等待同一 SHA 的 CI 成功 / Require green CI on this SHA
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TIMEOUT_SECONDS: "2400"
          POLL_SECONDS: "20"
        run: |
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while :; do
            state=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '
              [.workflow_runs[] | select(.path == ".github/workflows/ci.yml")]
              | if any(.[]; .conclusion == "success") then "success"
                elif any(.[]; .status == "completed" and .conclusion != "success") then "failed"
                elif length > 0 then "pending"
                else "missing" end')
            case "$state" in
              success)
                echo "同一 SHA 的 CI 已通过 / CI passed on $SHA"
                exit 0
                ;;
              failed)
                echo "同一 SHA 的 CI 未通过，拒绝打标签 / CI failed on $SHA; refusing to tag" >&2
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "等待 CI 超时（$state）/ Timed out waiting for CI on $SHA ($state)" >&2
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
      - name: 推送发行标签 / Push release tag
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
  # The tag pushed above triggers release.yml through its `push: tags: v*`
  # trigger. Calling release.yml from here as well published every release
  # twice: the second `gh release create --verify-tag` exited non-zero after the
  # assets already existed. One tag push, one publisher.
