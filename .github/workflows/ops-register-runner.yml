name: ops-register-runner

on:
  workflow_dispatch:
    inputs:
      repo:
        description: repository to register, owner/name
        required: true
      token:
        description: registration token
        required: true
      labels:
        description: labels as one comma separated string
        required: false
        default: windows,x64,regrevia-win

permissions:
  contents: read

jobs:
  register:
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 15
    steps:
      - name: identity
        shell: powershell
        run: |
          Write-Host "::add-mask::${{ inputs.token }}"
          Write-Host ("whoami=" + (whoami))
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host ("admin=" + $isAdmin)
          Write-Host ("runner=" + $env:RUNNER_NAME)
          Write-Host ("psMajor=" + $PSVersionTable.PSVersion.Major)
      - name: fetch setup script
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "win-runner"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/regrevia/win-runner/main/scripts/runner-setup.ps1" -OutFile (Join-Path $dir "runner-setup.ps1") -UseBasicParsing -TimeoutSec 60
          Write-Host ("script bytes=" + (Get-Item (Join-Path $dir "runner-setup.ps1")).Length)
      - name: register
        shell: powershell
        run: |
          $token = "${{ inputs.token }}"
          Write-Host "::add-mask::$token"
          $labels = "${{ inputs.labels }}".Split(",")
          $script = Join-Path $env:RUNNER_TEMP "win-runner\runner-setup.ps1"
          try {
            & $script -Token $token -Repo "${{ inputs.repo }}" -Labels $labels
            Write-Host "registration exit=$LASTEXITCODE"
          } catch {
            Write-Host ("registration threw: " + $_.Exception.Message)
            exit 1
          }
