name: Envoy 正式发行 / Envoy Release

on:
  push:
    tags:
      - "v*"
  # Auto Release pushes the tag with the run's GITHUB_TOKEN, and GitHub does not
  # start a workflow for a ref pushed by GITHUB_TOKEN. It dispatches this one
  # explicitly instead, which needs a workflow_dispatch trigger of its own.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布安装包 / Build and publish assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 验证标签与包版本 / Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          for path in (
              Path("packages/envoy-cli/pyproject.toml"),
              Path("packages/envoy-core/pyproject.toml"),
          ):
              actual = tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
              if actual != expected:
                  raise SystemExit(f"{path}: version {actual} does not match tag {expected}")
          PY
      - name: 校验同源版本与清单 / Verify declarations agree
        run: |
          python scripts/check_versions.py --check
          python scripts/check_release_manifest.py --check
          python scripts/build_envoy_dsh_plugin.py --check
          python scripts/sync_host_skills.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 构建可安装产物 / Build installable assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python scripts/build_envoy_cli_wheel.py --output-dir dist --channel release
          python scripts/package_envoy_skill.py --output dist/envoy-skill.zip --version "${RELEASE_TAG#v}" --json
          npm pack --pack-destination dist integrations/dsh/envoy-dsh
          cp integrations/install.sh dist/install.sh
          cp integrations/install.ps1 dist/install.ps1
      # The manifest hashes every file already in dist/, so it is written after
      # all assets exist and before SHA256SUMS, which then also covers the
      # manifest and both installers a host downloads first.
      - name: 生成清单与校验和 / Emit manifest and checksums
        run: |
          python scripts/check_release_manifest.py --emit dist/release-manifest.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          assets = sorted(path for path in Path("dist").iterdir() if path.is_file())
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in assets
          ]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("\n".join(lines))
          PY
      - name: 发布 npm 包 / Publish the npm bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; the bundle is attached to the release but not published to npm"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish dist/envoy-dsh-*.tgz --access public
      - name: Publish GitHub Release (Chinese first, English below)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file CHANGELOG.md
