name: Envoy Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish local Skill assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          for path in (
              Path("packages/envoy-cli/pyproject.toml"),
              Path("packages/envoy-core/pyproject.toml"),
          ):
              actual = tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
              if actual != expected:
                  raise SystemExit(f"{path}: version {actual} does not match tag {expected}")
          PY
      - name: Build installable assets
        run: |
          python -m pip install --upgrade pip
          python scripts/build_envoy_cli_wheel.py --output-dir dist
          python scripts/package_envoy_skill.py --output dist/envoy-skill.zip --version "${GITHUB_REF_NAME#v}" --json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          assets = sorted(path for path in Path("dist").iterdir() if path.is_file())
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in assets
          ]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
