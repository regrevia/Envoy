name: Envoy CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-media.txt
      - name: Install media runtime dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "setuptools<81" wheel
          python -m pip install --no-build-isolation -r backend/requirements-media.txt
          python -m pip install -e packages/envoy-core
          python -m pip install -e packages/envoy-cli
      - name: Run video and export tests
        run: >
          pytest -q
          tests/test_video_url_ingestion.py
          tests/test_video_browser_discovery.py
          tests/test_browser_session_api.py
          tests/test_video_library_export.py
          tests/test_video_to_markdown_flow.py
          tests/test_vision_service.py
          tests/core_protocol
          tests/cli
          tests/test_video_evidence_eval.py
          tests/test_platform_video_probe.py
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_public_page_ingestion.py
        working-directory: .
      - name: Build credential-free Skill bundle
        run: |
          python scripts/package_envoy_skill.py --output /tmp/envoy-skill.zip --json
          unzip -l /tmp/envoy-skill.zip
      - name: Build self-contained GitHub install wheel
        run: |
          python scripts/build_envoy_cli_wheel.py --output-dir /tmp/envoy-wheel
          python -m pip install --target /tmp/envoy-wheel-smoke /tmp/envoy-wheel/envoy_cli-*.whl
          PYTHONPATH=/tmp/envoy-wheel-smoke python -c "import envoy_cli, envoy_core; print(envoy_cli.__version__, envoy_core.__version__)"

  standalone-windows:
    name: Standalone Skill on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/envoy-cli/pyproject.toml
      - name: Install standalone runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "reportlab==4.5.0"
          python -m pip install -e packages/envoy-core -e packages/envoy-cli
      - name: Run cross-platform Skill, protocol, and material tests
        run: >
          pytest -q
          tests/cli
          tests/core_protocol
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_video_evidence_eval.py

  standalone-macos:
    name: Standalone Skill on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/envoy-cli/pyproject.toml
      - name: Install standalone runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "reportlab==4.5.0"
          python -m pip install -e packages/envoy-core -e packages/envoy-cli
      - name: Run macOS Skill, protocol, MCP, and install tests
        run: >
          pytest -q
          tests/cli
          tests/core_protocol
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_video_evidence_eval.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
