name: Envoy 持续集成 / CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试 / Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-media.txt
      - name: 安装媒体运行依赖 / Install media runtime dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "setuptools<81" wheel
          python -m pip install --no-build-isolation -r backend/requirements-media.txt
          python -m pip install -e packages/envoy-core
          python -m pip install -e packages/envoy-cli
      # 浏览器运行时用例会在真实 Chromium 里跑，runner 上必须先把浏览器装好，
      # 否则这批用例全部以 BrowserRuntimeUnavailable 失败（不是代码问题）。
      - name: 安装 Chromium（浏览器用例） / Install Chromium for browser tests
        run: python -m playwright install chromium
      - name: 运行视频与导出测试 / Run video and export tests
        run: >
          pytest -q
          tests/test_video_url_ingestion.py
          tests/test_video_browser_discovery.py
          tests/test_browser_session_api.py
          tests/test_video_library_export.py
          tests/test_video_to_markdown_flow.py
          tests/test_vision_service.py
          tests/core_protocol
          tests/cli
          tests/test_video_evidence_eval.py
          tests/test_ocr_quality_eval.py
          tests/test_paired_experiment_plan.py
          tests/test_usage_ledger.py
          tests/test_agent_product_eval.py
          tests/test_platform_video_probe.py
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_repo_consistency.py
          tests/test_dsh_plugin.py
          tests/test_public_page_ingestion.py
        working-directory: .
      - name: 校验版本与生成物 / Check versions and generated artifacts
        run: |
          python scripts/check_versions.py --check
          python scripts/check_release_manifest.py --check
          python scripts/sync_host_skills.py --check
          python scripts/build_envoy_dsh_plugin.py --check
          python scripts/embed_dsh_launcher.py --check
      - name: 构建无凭据 Skill 包 / Build credential-free Skill bundle
        run: |
          python scripts/package_envoy_skill.py --output /tmp/envoy-skill.zip --json
          unzip -l /tmp/envoy-skill.zip
      - name: 构建 GitHub 自包含安装包 / Build self-contained install wheel
        run: |
          python scripts/build_envoy_cli_wheel.py --output-dir /tmp/envoy-wheel
          python -m pip install --target /tmp/envoy-wheel-smoke /tmp/envoy-wheel/envoy_cli-*.whl
          PYTHONPATH=/tmp/envoy-wheel-smoke python -c "import envoy_cli, envoy_core; print(envoy_cli.__version__, envoy_core.__version__)"

  lint:
    name: 静态检查 / Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装并运行 ruff / Install and run ruff
        run: |
          python -m pip install "ruff==0.17.2"
          python -m ruff check .

  standalone-windows:
    name: Windows 独立运行测试 / Standalone Skill on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/envoy-cli/pyproject.toml
      # install.ps1 只有 Windows 才跑得到：先在解析器里过一遍，语法错了当场红。
      - name: 解析安装脚本 / Parse the installer scripts
        shell: pwsh
        run: |
          $files = @("integrations/install.ps1", "scripts/windows/acceptance.ps1")
          foreach ($file in $files) {
            $errors = $null
            $path = (Resolve-Path $file).Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($error in $errors) { Write-Host "::error file=$file,line=$($error.Extent.StartLineNumber)::$($error.Message)" }
              exit 1
            }
          }

      - name: 安装独立运行与测试依赖 / Install standalone runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "reportlab==4.5.0"
          python -m pip install -e packages/envoy-core -e packages/envoy-cli
      # 浏览器运行时用例会在真实 Chromium 里跑，runner 上必须先把浏览器装好，
      # 否则这批用例全部以 BrowserRuntimeUnavailable 失败（不是代码问题）。
      - name: 安装 Chromium（浏览器用例） / Install Chromium for browser tests
        run: python -m playwright install chromium
      - name: 运行 Skill、协议和材料测试 / Run Skill, protocol, and material tests
        run: >
          pytest -q
          tests/cli
          tests/core_protocol
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_repo_consistency.py
          tests/test_video_evidence_eval.py

  standalone-macos:
    name: macOS 独立运行测试 / Standalone Skill on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/envoy-cli/pyproject.toml
      - name: 安装独立运行与测试依赖 / Install standalone runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "reportlab==4.5.0"
          python -m pip install -e packages/envoy-core -e packages/envoy-cli
      # 浏览器运行时用例会在真实 Chromium 里跑，runner 上必须先把浏览器装好，
      # 否则这批用例全部以 BrowserRuntimeUnavailable 失败（不是代码问题）。
      - name: 安装 Chromium（浏览器用例） / Install Chromium for browser tests
        run: python -m playwright install chromium
      - name: 运行 Skill、协议、MCP 和安装测试 / Run Skill, protocol, MCP, and install tests
        run: >
          pytest -q
          tests/cli
          tests/core_protocol
          tests/test_envoy_cli_distribution.py
          tests/test_skill_bundle.py
          tests/test_repo_consistency.py
          tests/test_video_evidence_eval.py

  dsh-plugin:
    name: DSH 插件测试 / DSH plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Node >=22 下 `node --test <目录>` 不会发现目录里的 *.test.js（实测只报 1 个 pass），
      # 必须写成显式文件或带引号的 glob；这里用显式文件，任何 Node 20+ 都成立。
      - name: 运行 DSH 插件 JS 测试 / Run DSH plugin JS tests
        run: node --test integrations/dsh/envoy-dsh/index.test.js
      # link-verdicts.json 是 platforms.py 的生成物，漂移即失败。
      - name: 校验链接判定 JSON 未过期 / Check exported link verdicts
        run: python3 scripts/export_link_verdicts.py --check

  frontend:
    name: 前端构建 / Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    name: Compose 配置验证 / Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
