name: Envoy CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-media.txt
      - name: Install media runtime dependencies
        run: |
          python -m pip install "setuptools<81" wheel
          python -m pip install --no-build-isolation -r backend/requirements-media.txt
      - name: Run video and export tests
        run: >
          pytest -q
          tests/test_video_url_ingestion.py
          tests/test_video_browser_discovery.py
          tests/test_browser_session_api.py
          tests/test_video_library_export.py
          tests/test_video_to_markdown_flow.py
          tests/test_vision_service.py
        working-directory: .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
