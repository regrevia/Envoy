[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-cli"
version = "0.1.0"
description = "Independent Envoy link reader launcher"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=5.1,<6",
  "yt-dlp>=2025.10.14,<2027",
]

[project.scripts]
envoy = "envoy_cli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["envoy_cli*", "envoy_core*"]
