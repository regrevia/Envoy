[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-cli"
version = "0.1.4"
description = "Independent Envoy link reader launcher"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=5.1,<6",
  "pydantic>=2.10,<3",
  "yt-dlp>=2026.8.19,<2027",
  "playwright>=1.52,<2",
]

[project.optional-dependencies]
media = ["openai-whisper==20250625"]

[project.scripts]
envoy = "envoy_cli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["envoy_cli*", "envoy_core*"]
