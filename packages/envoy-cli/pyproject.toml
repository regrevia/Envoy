[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-cli"
version = "0.1.0"
description = "Independent Envoy link reader launcher"
requires-python = ">=3.9"
dependencies = [
  "envoy-core==0.1.0",
  "httpx>=0.28,<1",
  "pypdf>=5.1,<6",
]

[project.scripts]
envoy = "envoy_cli.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
