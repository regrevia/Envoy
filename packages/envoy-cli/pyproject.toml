[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-cli"
version = "0.1.37"
license = {text = "Apache-2.0"}
description = "Independent Envoy link reader launcher"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=5.1,<6",
  "pydantic>=2.10,<3",
  "yt-dlp>=2026.8.19,<2027",
  "playwright>=1.52,<2",
]

[project.optional-dependencies]
media = ["openai-whisper==20250625"]
ocr = ["Pillow>=10,<13"]
ocr-vision = [
  "Pillow>=10,<13",
  "pyobjc-framework-Vision>=10,<12; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10,<12; sys_platform == 'darwin'",
]
ocr-rapid = ["Pillow>=10,<13", "rapidocr-onnxruntime>=1.3,<2"]

[project.scripts]
envoy = "envoy_cli.entry:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["envoy_cli*", "envoy_core*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
envoy_cli = ["hook_scripts/*.sh", "hook_scripts/*.ps1"]
