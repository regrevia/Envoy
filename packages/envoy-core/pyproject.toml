[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-core"
version = "0.1.4"
description = "Framework-independent link reading materials and evidence protocol for Envoy"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
