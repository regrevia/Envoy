# Ruff configuration for the Envoy monorepo.
#
# Only rules that catch real defects are enabled today: pyflakes (F) and the
# syntax-error subset of pycodestyle (E4/E7/E9). Formatting and import order
# are deliberately not enforced yet — `ruff format` would rewrite 87 files and
# `I001` would reorder imports in 288 places, so those belong in their own
# formatting commit rather than mixed into feature work.
target-version = "py311"
line-length = 100

# The FastAPI application and the Next.js frontend are separate toolchains with
# their own packaging; `__init__.py` re-exports in backend/ are intentional.
extend-exclude = ["backend", "frontend"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test and probe scripts adjust sys.path before importing the package under
# test, so imports legitimately follow executable statements.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
"benchmarks/**" = ["E402"]
